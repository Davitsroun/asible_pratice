---
# Install k3s: 1 control plane + 2 workers, then verify

- name: Install k3s on control plane
  hosts: controlplane
  gather_facts: true
  roles:
    - role: k3s_server

- name: Join worker nodes
  hosts: workers
  gather_facts: true
  vars:
    k3s_token: "{{ hostvars[groups['controlplane'][0]]['k3s_token'] }}"
    k3s_url: "{{ hostvars[groups['controlplane'][0]]['k3s_url'] }}"
  roles:
    - role: k3s_agent

- name: Verify cluster nodes
  hosts: controlplane
  gather_facts: false
  tasks:
    - name: Wait for all nodes Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: nodes_out
      retries: 36
      delay: 5
      until: >
        nodes_out.stdout_lines | length >= 4
        and (nodes_out.stdout | regex_findall('Ready') | length) >= 3
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        var: nodes_out.stdout_lines
