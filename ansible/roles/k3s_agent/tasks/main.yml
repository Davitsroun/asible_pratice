---
# Join worker node to k3s cluster (binary install — no systemd)

- name: Require token and URL
  ansible.builtin.assert:
    that:
      - k3s_token | length > 0
      - k3s_url | length > 0
    fail_msg: "k3s_token and k3s_url must be set (from control plane)"

- name: Ensure download tools present
  ansible.builtin.shell: |
    if command -v curl >/dev/null 2>&1; then exit 0; fi
    cat > /etc/apt/apt.conf.d/99insecure <<'CFG'
    Acquire::https::Verify-Peer "false";
    Acquire::https::Verify-Host "false";
    CFG
    sed -i 's|http://|https://|g' /etc/apt/sources.list
    apt-get update
    apt-get install -y --no-install-recommends curl ca-certificates
  args:
    executable: /bin/bash

- name: Disable swap if present
  ansible.builtin.shell: |
    swapoff -a || true
    sed -i '/ swap / s/^/#/' /etc/fstab || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Download k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_release | replace('+', '%2B') }}/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
    force: false

- name: Start k3s agent in background
  ansible.builtin.shell: |
    mkdir -p /var/log /var/lib/rancher/k3s
    exec env K3S_URL="{{ k3s_url }}" K3S_TOKEN="{{ k3s_token }}" \
      /usr/local/bin/k3s agent {{ k3s_agent_opts }} >>/var/log/k3s-agent.log 2>&1
  args:
    executable: /bin/bash
  async: 86400
  poll: 0
