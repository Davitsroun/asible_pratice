---
# Prepare host + install k3s server (Docker-friendly: binary + nohup)

- name: Ensure download tools present
  ansible.builtin.shell: |
    if command -v curl >/dev/null 2>&1; then exit 0; fi
    cat > /etc/apt/apt.conf.d/99insecure <<'CFG'
    Acquire::https::Verify-Peer "false";
    Acquire::https::Verify-Host "false";
    CFG
    sed -i 's|http://|https://|g' /etc/apt/sources.list
    apt-get update
    apt-get install -y --no-install-recommends curl ca-certificates
  args:
    executable: /bin/bash

- name: Disable swap if present
  ansible.builtin.shell: |
    swapoff -a || true
    sed -i '/ swap / s/^/#/' /etc/fstab || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Download k3s binary (no systemd/openrc needed)
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_release | replace('+', '%2B') }}/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
    force: false

- name: Create kubectl helper symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
    force: true

- name: Start k3s server in background
  ansible.builtin.shell: |
    mkdir -p /var/log /var/lib/rancher/k3s /etc/rancher/k3s
    exec /usr/local/bin/k3s server {{ k3s_server_opts }} >>/var/log/k3s-server.log 2>&1
  args:
    executable: /bin/bash
  async: 86400
  poll: 0
  register: k3s_server_async

- name: Wait until k3s API is ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_nodes
  retries: 40
  delay: 5
  until: k3s_nodes.rc == 0
  changed_when: false

- name: Read node token for workers
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_b64

- name: Set token fact for other plays
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_b64.content | b64decode | trim }}"
    k3s_url: "https://{{ ansible_host | default(inventory_hostname) }}:6443"

- name: Fetch kubeconfig to ansible workspace
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_local_path }}"
    flat: true

- name: Fix kubeconfig server address for remote use
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_local_path }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host | default(inventory_hostname) }}:6443"
  delegate_to: localhost
  become: false
